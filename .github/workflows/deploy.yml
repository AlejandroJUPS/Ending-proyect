name: Publicar Ending
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Crear configuración privada
        env:
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
        run: |
          mkdir -p .private
          php -r '$c=["host"=>"sql102.infinityfree.com","database"=>"if0_43158060_END","user"=>"if0_43158060","password"=>getenv("MYSQL_PASSWORD")]; file_put_contents(".private/db-config.php","<?php return ".var_export($c,true).";\n");'
      - name: Subir por FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ftpupload.net
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          server-dir: htdocs/
          exclude: |
            **/.git*
            **/.git*/**
            **/README.md
            **/sql/**
            **/roms/**
            **/.ftp-deploy-sync-state.json
